name: Portfolio quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://portfolio:test-only-password@localhost:5432/portfolio_test
      E2E_ADMIN_EMAIL: tests@example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          auth_secret=$(openssl rand -hex 32)
          admin_password=$(openssl rand -hex 24)
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$admin_password"
          echo "BETTER_AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
      - run: npm run test:prepare
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
